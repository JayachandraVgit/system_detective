<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Detective</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>System Detective</h1>
    <p>Computer Organisation & Operating Systems — System Dashboard</p>
    <button id="refreshBtn">Refresh Data</button>
</header>

<main>

    <section class="stats-grid">

        <div class="card">
            <h2>CPU / ISA</h2>
            <div id="cpu"></div>
        </div>

        <div class="card">
            <h2>Memory Usage</h2>
            <div id="memory"></div>
        </div>

    </section>

    <section class="card">
        <h2>Top 5 Processes</h2>

        <table>
            <thead>
                <tr>
                    <th>PID</th>
                    <th>Process</th>
                    <th>State</th>
                    <th>CPU %</th>
                    <th>Memory %</th>
                </tr>
            </thead>

            <tbody id="processes"></tbody>
        </table>
    </section>

    <section class="card">
        <h2>Memory Locality</h2>

        <div id="locality-summary"></div>

        <div class="locality-chart">
            <div class="bar-row">
                <span>Row-major</span>
                <div class="bar-container">
                    <div id="row-bar" class="bar"></div>
                </div>
                <span id="row-time"></span>
            </div>

            <div class="bar-row">
                <span>Column-major</span>
                <div class="bar-container">
                    <div id="column-bar" class="bar"></div>
                </div>
                <span id="column-time"></span>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Run</th>
                    <th>Row-major (s)</th>
                    <th>Column-major (s)</th>
                    <th>Ratio</th>
                </tr>
            </thead>

            <tbody id="locality"></tbody>
        </table>
    </section>

</main>

<footer>
    <p>Live data from WSL2 Ubuntu</p>
    <p id="updated"></p>
</footer>

<script src="script.js"></script>

</body>
</html>
